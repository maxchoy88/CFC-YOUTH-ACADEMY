                            const dateStr = (typeof h === 'string') ? h : (h.date || 'N/A');
                            csvContent += `"${item.name.toUpperCase()}","${item.team || item.role}","${dateStr}","PRESENT"\n`;
                        });
                    } else {
                        csvContent += `"${item.name.toUpperCase()}","${item.team || item.role}","N/A","NO_HISTORY"\n`;
                    }
                });
                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a"); 
                link.href = URL.createObjectURL(blob); 
                link.download = `CFC_FullHistory_${targetSchool}_${new Date().toISOString().slice(0, 10)}.csv`; 
                link.click();
            };

            const handleExportMonthlyReport = () => {
                const month = attendanceDate.slice(0, 7); 
                const targetSchool = selectedTeam === '全部' || selectedTeam === 'All' || selectedTeam === 'Semua' ? 'All_Schools' : selectedTeam;
                const list = attTab === 'trainees' ? filteredTrainees : coaches;
                const allDates = new Set();
                list.forEach(item => {
                    const history = item.attendanceHistory || [];
                    history.forEach(h => {
                        const d = (typeof h === 'string' ? h : h.date);
                        if (d && d.startsWith(month)) allDates.add(d);
                    });
                });
                const sortedDates = Array.from(allDates).sort();
                if (sortedDates.length === 0) { alert(`${t('noData')} (${month})`); return; }
                let csvContent = `\uFEFF${targetSchool} - ${month} Report\n`;
                csvContent += `Name,Team,${sortedDates.join(',')},Total\n`;
                list.forEach(item => {
                    const history = item.attendanceHistory || [];
                    const presentDates = new Set(history.map(h => (typeof h === 'string' ? h : h.date)));
                    let row = `${item.name.toUpperCase()},${item.team || item.role}`;
                    let count = 0;
                    sortedDates.forEach(date => {
                        if (presentDates.has(date)) { row += `,1`; count++; } else { row += `,0`; }
                    });
                    row += `,${count}\n`;
                    csvContent += row;
                });
                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a"); 
                link.href = URL.createObjectURL(blob); 
                link.download = `CFC_Report_${targetSchool}_${month}.csv`;

                if (t.secondaryPosition && t.secondaryPosition !== '无') text += ` / ${t.secondaryPosition}`;
                text += `\n\n📊 ${L.stats.pace}: ${t.stats.pace} | ${L.stats.shooting}: ${t.stats.shooting}\n${L.stats.passing}: ${t.stats.passing} | ${L.stats.dribbling}: ${t.stats.dribbling}\n${L.stats.defending}: ${t.stats.defending} | ${L.stats.physical}: ${t.stats.physical}\n\n📈 Attendance: ${t.attendance}%`;

                return text;

            const mockAI = () => { 
                setAiLoading(true);

                    const s = formData.stats || { pace: 50, shooting: 50, passing: 50, dribbling: 50, defending: 50, physical: 50 };

                                        </div>
                                    </div>

                                    <button onClick={handleSaveTrainee} className="w-full py-5 bg-white text-zinc-900 rounded-[2rem] font-black text-xl shadow-2xl active:scale-[0.98] transition-all mt-4 uppercase tracking-tighter leading-none">{t('common', 'save')}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- Finance Modal --- */}
                    {isFinanceOpen && (<div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm fade-in"><div className="bg-zinc-900 w-full max-w-lg rounded-2xl border border-yellow-600 shadow-2xl p-6 max-h-[90vh] overflow-y-auto flex flex-col"><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-white flex items-center gap-2 uppercase"><i className="fa-solid fa-sack-dollar text-yellow-500"></i> {t('finTitle')}</h2><button onClick={() => setIsFinanceOpen(false)}><i className="fa-solid fa-xmark text-xl text-zinc-500 hover:text-white"></i></button></div><div className="bg-yellow-900/20 border border-yellow-800 p-3 rounded-xl mb-4 flex justify-between items-center relative group"><div className="text-xs text-yellow-200"><p className="font-bold">{BANK_INFO.bankName}</p><p className="font-mono text-yellow-400 text-sm my-0.5">{BANK_INFO.accNum}</p><p className="text-[10px] opacity-70">{BANK_INFO.holder}</p></div><button onClick={copyBankInfo} className="bg-yellow-700/50 hover:bg-yellow-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1"><i className="fa-regular fa-copy"></i> {t('finCopy')}</button></div><div className="grid grid-cols-2 gap-3 mb-4"><div className="bg-emerald-900/30 border border-emerald-800 p-3 rounded-xl flex flex-col items-center"><span className="text-[10px] text-emerald-400 uppercase">{t('finTotal')}</span><span className="text-xl font-bold text-white">RM {financeSummary.total}</span><span className="text-[10px] text-zinc-400">({financeSummary.paidCount} pax)</span></div><div className="bg-red-900/30 border border-red-800 p-3 rounded-xl flex flex-col items-center"><span className="text-[10px] text-red-400 uppercase">{t('finPending')}</span><span className="text-xl font-bold text-white">RM {financeSummary.pending}</span><span className="text-[10px] text-zinc-400">({filteredTrainees.length - financeSummary.paidCount} pax)</span></div></div>
                    <div className="mb-2 px-1">
                        <input className="w-full bg-black/50 border border-zinc-700 rounded-lg text-xs px-2 py-1.5 text-white focus:border-yellow-500 outline-none" placeholder={t('finSearch')} value={financeSearchTerm} onChange={e => setFinanceSearchTerm(e.target.value)} />
                    </div>
                    <div className="flex justify-between items-center mb-2 px-1">
                        <span className="text-xs text-zinc-500">Selected: {financeFiltered.length}</span>
                        <button onClick={toggleAllFeeStatus} className="text-xs text-indigo-400 hover:text-indigo-300 font-bold border border-indigo-500/30 px-2 py-1 rounded">
                            {t('finToggleAll')}
                        </button>
                    </div>
                    <div className="flex gap-2 mb-4"><div className="flex-1 flex justify-between items-center bg-zinc-950 p-2 rounded-lg border border-zinc-800"><span className="text-xs text-zinc-400 pl-2">{t('finFee')}</span><input type="number" className="w-20 bg-black text-white text-right text-sm px-2 py-1 rounded border border-zinc-700 focus:border-yellow-500 outline-none" value={monthlyFee} onChange={e => setMonthlyFee(parseInt(e.target.value) || 0)} /></div><select className="w-1/3 bg-zinc-950 border border-zinc-800 rounded-lg text-white text-xs px-2 outline-none" value={msgTemplate} onChange={(e) => setMsgTemplate(e.target.value)}><option value="gentle">🌸 {t('msgTemplates', 'gentle')}</option><option value="friendly">🤝 {t('msgTemplates', 'friendly')}</option><option value="soft">🍃 {t('msgTemplates', 'soft')}</option><option value="formal">👔 {t('msgTemplates', 'formal')}</option></select></div><div className="flex-1 overflow-y-auto space-y-2 mb-4 pr-1">{financeFiltered.map(trainee => { const isPaid = trainee.feeHistory && trainee.feeHistory[financeMonth]; return (<div key={trainee.id} className="flex items-center justify-between p-3 rounded-xl border border-zinc-700 bg-zinc-800/30"><div className="flex items-center gap-3"><div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${isPaid ? 'bg-emerald-600 text-white' : 'bg-red-900/50 text-red-500 border border-red-800'}`}>{isPaid ? <i className="fa-solid fa-check"></i> : "RM"}</div><div><p className="text-sm font-bold text-white uppercase">{trainee.name}</p><p className="text-[10px] text-zinc-500 uppercase">{trainee.team}</p></div></div><button onClick={() => toggleFeeStatus(trainee.id)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${isPaid ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-transparent border-zinc-600 text-zinc-400 hover:border-yellow-500 hover:text-yellow-500'}`}>{isPaid ? t('common', 'paid') : t('common', 'unpaid')}</button></div>); })}</div><button onClick={exportFinanceExcel} className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-xl border border-zinc-600 flex items-center justify-center gap-2"><i className="fa-solid fa-file-invoice-dollar"></i> {t('finExport')}</button></div></div>)}

                    {/* --- Cloud/Backup Modal --- */}
                    {isDataToolsOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm fade-in">
                            <div className="bg-zinc-900 w-full max-w-md rounded-2xl border border-zinc-800 shadow-2xl p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-bold text-white uppercase flex items-center gap-2"><i className="fa-solid fa-cloud-arrow-up text-indigo-500"></i> {t('backupTools')}</h2>
                                    <button onClick={() => setIsDataToolsOpen(false)}><i className="fa-solid fa-xmark text-zinc-500 hover:text-white"></i></button>
                                </div>
                                <div className="space-y-4">
                                    <button onClick={handleBackupToDrive} className="w-full py-3 bg-emerald-700 hover:bg-emerald-600 text-white rounded-xl font-bold text-sm shadow-lg flex items-center justify-center gap-2 border border-emerald-500"><i className="fa-solid fa-download"></i> {t('backupToDrive')}</button>
                                    <div className="bg-zinc-950 p-4 rounded-xl border border-zinc-800">
                                        <h3 className="text-zinc-300 font-bold mb-2 flex items-center gap-2 uppercase text-xs"><i className="fa-solid fa-file-import text-indigo-500"></i> {t('restoreData')}</h3>
                                        <button className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-indigo-400 border border-indigo-900/50 rounded-xl font-bold text-sm shadow-lg transition flex items-center justify-center gap-2" onClick={() => backupInputRef.current.click()}><i className="fa-solid fa-folder-open"></i> {t('selectFile')}</button>
                                        <input type="file" ref={backupInputRef} className="hidden" accept=".json" onChange={handleImportFile} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- Cropper Modal --- */}
                    {isCropperOpen && (
                        <div className="fixed inset-0 z-[10000] bg-black flex flex-col items-center justify-center p-4 font-black">
                            <h3 className="text-white mb-8 tracking-[0.2em] uppercase text-xl text-center font-bold">Crop Image</h3>
                            <div className="max-w-full max-h-[60vh] bg-zinc-900 rounded-[2.5rem] overflow-hidden mb-10 shadow-2xl border border-zinc-800 shadow-black"><img ref={cropperImageRef} src={tempImage} style={{maxWidth: '100%'}} /></div>
                            <div className="flex gap-4 w-full max-w-sm">
                                <button onClick={handleCropConfirm} className="flex-[2] py-5 bg-emerald-600 rounded-3xl text-white shadow-xl text-lg uppercase tracking-widest active:scale-95 transition-transform font-black leading-none">Confirm</button>
                                <button onClick={() => {setIsCropperOpen(false); setTempImage(null);}} className="flex-1 py-5 bg-red-600 rounded-3xl text-white shadow-lg uppercase active:scale-95 transition-transform font-black leading-none">Cancel</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
