                const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `CFC_Att_${attendanceDate}.csv`; link.click();

                let csvContent = "\uFEFFName,Team,Status,Amount\n";
                financeFiltered.forEach(t => {
                    const isPaid = t.feeHistory && t.feeHistory[financeMonth];
                    csvContent += `${t.name},${t.team},${isPaid ? 'PAID' : 'PENDING'},${monthlyFee}\n`;
                });
                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `CFC_Finance_${financeMonth}.csv`; link.click();
            };
            const generateShareText = (t) => {
                const L = TRANSLATIONS[lang] || TRANSLATIONS['zh'];
                let text = `⚽ ${L.appTitle}\n\n👤 ${t.name}\n🏫 ${t.team}\n📍 ${t.primaryPosition}`;
                if (t.secondaryPosition && t.secondaryPosition !== '无') text += ` / ${t.secondaryPosition}`;
                text += `\n\n📊 ${L.stats.pace}: ${t.stats.pace} | ${L.stats.shooting}: ${t.stats.shooting}\n${L.stats.passing}: ${t.stats.passing} | ${L.stats.dribbling}: ${t.stats.dribbling}\n${L.stats.defending}: ${t.stats.defending} | ${L.stats.physical}: ${t.stats.physical}\n\n📈 Attendance: ${t.attendance}%`;
                if (t.coachComment) text += `\n\n💬 Coach: ${t.coachComment}`;
                return text;
            };

                const text = generateShareText(t);
                if(navigator.share) {
                    navigator.share({title:t.name, text: text}).catch(err => {
                        if (err.name !== 'AbortError') setShareTarget(t);

                    setShareTarget(t);

                setAppLogo(local.appLogo || null);
                if (local.teams) setTeams(local.teams);

                if (savedCloud.binId) { setCloudConfig(savedCloud); syncFromCloud(savedCloud.key, savedCloud.binId); }

                                    <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
                                    <i className="fa-solid fa-user-shield text-emerald-400 text-xl"></i> 
                                    <span className="tracking-widest text-sm">{t('auth', 'adminMode')}</span>
                                </button>

                                    <i className="fa-solid fa-users text-blue-500/70 text-xl"></i> 
                                    <span className="tracking-widest">{t('auth', 'userMode')}</span>
                                </button>

                            <div className="bg-zinc-900/80 backdrop-blur-xl p-8 rounded-[2rem] border border-white/10 shadow-2xl">

                        <div className="flex gap-2">
                             <button onClick={testCloudinary} className="flex-1 py-2 bg-zinc-700 hover:bg-zinc-600 text-white text-xs font-bold rounded-lg border border-zinc-600">{t('imgTest')}</button>
                             <button onClick={saveImgConfig} className="flex-1 py-2 bg-blue-900/50 hover:bg-blue-800 text-blue-400 text-xs font-bold rounded-lg border border-blue-900/30">{t('imgSave')}</button>
                        </div>
                    </div>
                    
                    <button onClick={handleConnectCloud} className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition-transform active:scale-95 mt-2">{t('cloud', 'connect')}</button></div></div></div>)}
                    
                    {/* Attendance Modal */}
                    {isAttendanceOpen && (<div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm fade-in"><div className="bg-zinc-900 w-full max-w-lg rounded-2xl border border-zinc-800 shadow-2xl p-6 max-h-[90vh] overflow-y-auto flex flex-col"><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-white flex items-center gap-2"><i className="fa-solid fa-calendar-check text-emerald-500"></i> {t('attTitle')}</h2><div className="flex items-center gap-2"><input type="date" className="bg-zinc-800 text-white text-xs px-2 py-1 rounded border border-zinc-600 focus:border-emerald-500 outline-none" value={attendanceDate} onChange={(e) => setAttendanceDate(e.target.value)} /><button onClick={() => setIsAttendanceOpen(false)}><i className="fa-solid fa-xmark text-xl text-zinc-500 hover:text-white"></i></button></div></div>
                    {/* 🔥 Tabs for Attendance */}
                    <div className="flex bg-zinc-950 rounded-lg p-1 mb-4 border border-zinc-700">
                        <button onClick={() => setAttTab('trainees')} className={`flex-1 py-2 text-xs font-bold rounded ${attTab === 'trainees' ? 'bg-emerald-600 text-white' : 'text-zinc-500'}`}>{t('attTabTrainees')}</button>
                        <button onClick={() => setAttTab('coaches')} className={`flex-1 py-2 text-xs font-bold rounded ${attTab === 'coaches' ? 'bg-blue-600 text-white' : 'text-zinc-500'}`}>{t('attTabCoaches')}</button>
                    </div>
                    <div className="bg-zinc-950 p-4 rounded-xl border border-zinc-800 mb-4"><label className="text-zinc-400 text-xs font-bold block mb-2">{t('attPaste')}</label><textarea className="w-full bg-black border border-zinc-700 rounded-lg p-3 text-xs text-white h-20 mb-2 focus:border-emerald-500 outline-none" placeholder={t('attPlaceholder')} value={importText} onChange={e => setImportText(e.target.value)}></textarea><button onClick={parseImportText} className="w-full py-2 bg-zinc-800 hover:bg-zinc-700 text-emerald-400 border border-emerald-900/30 rounded-lg text-xs font-bold">{t('attPasteDesc')}</button></div>
                    {/* 🔥 考勤搜索栏 */}
                    <div className="mb-2 px-1">
                        <input className="w-full bg-black/50 border border-zinc-700 rounded-lg text-xs px-2 py-1.5 text-white focus:border-emerald-500 outline-none" placeholder={t('attSearch')} value={attendanceSearchTerm} onChange={e => setAttendanceSearchTerm(e.target.value)} />
                    </div>
                    <div className="flex justify-between items-center mb-2 px-1">
                        <span className="text-xs text-zinc-500">Selected: {attTab === 'trainees' ? attendanceList.length : coachAttendanceList.length}</span>
                        {/* 🔥 考勤一键全选 */}
                        <button onClick={toggleAllAttendanceStatus} className="text-xs text-indigo-400 hover:text-indigo-300 font-bold border border-indigo-500/30 px-2 py-1 rounded">
                            {t('attToggleAll')}
                        </button>
                    </div>
                    <div className="flex-1 overflow-y-auto space-y-2 mb-4 pr-1">
                        {attendanceFiltered.map(item => (
                            <div key={item.id} onClick={() => toggleAttendance(item.id)} className={`flex items-center justify-between p-3 rounded-xl border cursor-pointer transition-all ${(attTab === 'trainees' ? attendanceList.includes(item.id) : coachAttendanceList.includes(item.id)) ? 'bg-emerald-900/20 border-emerald-500/50' : 'bg-zinc-800/50 border-zinc-700'}`}>
                                <div className="flex items-center gap-3">
                                    <div className={`w-5 h-5 rounded-full flex items-center justify-center border ${(attTab === 'trainees' ? attendanceList.includes(item.id) : coachAttendanceList.includes(item.id)) ? 'bg-emerald-500 border-emerald-500' : 'border-zinc-500'}`}>{(attTab === 'trainees' ? attendanceList.includes(item.id) : coachAttendanceList.includes(item.id)) && <i className="fa-solid fa-check text-black text-xs"></i>}</div>
                                    <div><p className="text-sm font-bold text-white">{item.name}</p><p className="text-[10px] text-zinc-500">{item.team || item.role}</p></div>
                                </div>
                            </div>
                        ))}
                    </div><div className="flex gap-2"><button onClick={submitAttendance} className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-900/20">{t('attConfirm')}</button><button onClick={handleExportAttendanceExcel} className="px-4 py-3 bg-green-700 hover:bg-green-600 text-white font-bold rounded-xl shadow-lg flex items-center gap-2" title={t('attExcel')}><i className="fa-solid fa-file-csv"></i></button><button onClick={handleWhatsappShare} className="px-4 py-3 bg-[#25D366] hover:bg-[#1da851] text-white font-bold rounded-xl shadow-lg" title={t('attWhatsapp')}><i className="fa-brands fa-whatsapp text-xl"></i></button></div></div></div>)}
                    {/* Finance Modal */}
                    {isFinanceOpen && (<div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm fade-in"><div className="bg-zinc-900 w-full max-w-lg rounded-2xl border border-yellow-600 shadow-2xl p-6 max-h-[90vh] overflow-y-auto flex flex-col"><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-white flex items-center gap-2"><i className="fa-solid fa-sack-dollar text-yellow-500"></i> {t('finTitle')}</h2><div className="flex items-center gap-2"><input type="month" className="bg-zinc-800 text-white text-xs px-2 py-1 rounded border border-zinc-600 focus:border-yellow-500 outline-none" value={financeMonth} onChange={(e) => setFinanceMonth(e.target.value)} /><button onClick={() => setIsFinanceOpen(false)}><i className="fa-solid fa-xmark text-xl text-zinc-500 hover:text-white"></i></button></div></div><div className="bg-yellow-900/20 border border-yellow-800 p-3 rounded-xl mb-4 flex justify-between items-center relative group"><div className="text-xs text-yellow-200"><p className="font-bold">{BANK_INFO.bankName}</p><p className="font-mono text-yellow-400 text-sm my-0.5">{BANK_INFO.accNum}</p><p className="text-[10px] opacity-70">{BANK_INFO.holder}</p></div><button onClick={copyBankInfo} className="bg-yellow-700/50 hover:bg-yellow-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1"><i className="fa-regular fa-copy"></i> {t('finCopy')}</button></div><div className="grid grid-cols-2 gap-3 mb-4"><div className="bg-emerald-900/30 border border-emerald-800 p-3 rounded-xl flex flex-col items-center"><span className="text-[10px] text-emerald-400 uppercase">{t('finTotal')}</span><span className="text-xl font-bold text-white">RM {financeSummary.total}</span><span className="text-[10px] text-zinc-400">({financeSummary.paidCount} pax)</span></div><div className="bg-red-900/30 border border-red-800 p-3 rounded-xl flex flex-col items-center"><span className="text-[10px] text-red-400 uppercase">{t('finPending')}</span><span className="text-xl font-bold text-white">RM {financeSummary.pending}</span><span className="text-[10px] text-zinc-400">({filteredTrainees.length - financeSummary.paidCount} pax)</span></div></div>
                    <div className="mb-2 px-1">
                        <input className="w-full bg-black/50 border border-zinc-700 rounded-lg text-xs px-2 py-1.5 text-white focus:border-yellow-500 outline-none" placeholder={t('finSearch')} value={financeSearchTerm} onChange={e => setFinanceSearchTerm(e.target.value)} />
                    </div>
                    <div className="flex justify-between items-center mb-2 px-1">
                        <span className="text-xs text-zinc-500">Selected: {financeFiltered.length}</span>
                        <button onClick={toggleAllFeeStatus} className="text-xs text-indigo-400 hover:text-indigo-300 font-bold border border-indigo-500/30 px-2 py-1 rounded">
                            {t('finToggleAll')}
                        </button>
                    </div>
                    <div className="flex gap-2 mb-4"><div className="flex-1 flex justify-between items-center bg-zinc-950 p-2 rounded-lg border border-zinc-800"><span className="text-xs text-zinc-400 pl-2">{t('finFee')}</span><input type="number" className="w-20 bg-black text-white text-right text-sm px-2 py-1 rounded border border-zinc-700 focus:border-yellow-500 outline-none" value={monthlyFee} onChange={e => setMonthlyFee(parseInt(e.target.value) || 0)} /></div><select className="w-1/3 bg-zinc-950 border border-zinc-800 rounded-lg text-white text-xs px-2 outline-none" value={msgTemplate} onChange={(e) => setMsgTemplate(e.target.value)}><option value="gentle">🌸 {t('msgTemplates', 'gentle')}</option><option value="friendly">🤝 {t('msgTemplates', 'friendly')}</option><option value="soft">🍃 {t('msgTemplates', 'soft')}</option><option value="formal">👔 {t('msgTemplates', 'formal')}</option></select></div><div className="flex-1 overflow-y-auto space-y-2 mb-4 pr-1">{financeFiltered.map(trainee => { const isPaid = trainee.feeHistory && trainee.feeHistory[financeMonth]; return (<div key={trainee.id} className="flex items-center justify-between p-3 rounded-xl border border-zinc-700 bg-zinc-800/30"><div className="flex items-center gap-3"><div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${isPaid ? 'bg-emerald-600 text-white' : 'bg-red-900/50 text-red-500 border border-red-800'}`}>{isPaid ? <i className="fa-solid fa-check"></i> : "RM"}</div><div><p className="text-sm font-bold text-white">{trainee.name}</p><p className="text-[10px] text-zinc-500">{trainee.team}</p></div></div><div className="flex items-center gap-2">{!isPaid && (<button onClick={() => sendFeeReminder(trainee)} className="w-8 h-8 rounded-full bg-[#25D366]/20 hover:bg-[#25D366] text-[#25D366] hover:text-white border border-[#25D366]/50 flex items-center justify-center transition-all" title={t('finRemind')}><i className="fa-brands fa-whatsapp"></i></button>)}<button onClick={() => toggleFeeStatus(trainee.id)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${isPaid ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-transparent border-zinc-600 text-zinc-400 hover:border-yellow-500 hover:text-yellow-500'}`}>{isPaid ? t('finPaid') : t('finUnpaid')}</button></div></div>); })}</div><button onClick={exportFinanceExcel} className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-xl border border-zinc-600 flex items-center justify-center gap-2"><i className="fa-solid fa-file-invoice-dollar"></i> {t('finExport')}</button></div></div>)}
                    {isDataToolsOpen && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm fade-in"><div className="bg-zinc-900 w-full max-w-md rounded-2xl border border-zinc-800 shadow-2xl p-6"><div className="flex justify-between items-center mb-4"><h2 className="text-lg font-bold text-white flex items-center gap-2"><i className="fa-solid fa-cloud-arrow-up text-indigo-500"></i> {t('backupTools')}</h2><button onClick={() => setIsDataToolsOpen(false)}><i className="fa-solid fa-xmark text-zinc-500 hover:text-white"></i></button></div><div className="space-y-4"><div className="bg-zinc-950 p-4 rounded-xl border border-zinc-800 relative group overflow-hidden"><div className="absolute top-0 right-0 p-2 opacity-20"><i className="fab fa-google-drive text-6xl text-white"></i></div><h3 className="text-white font-bold mb-2 flex items-center gap-2 z-10 relative"><i className="fa-solid fa-cloud-upload-alt text-emerald-500"></i> {t('backupToDrive')}</h3><p className="text-zinc-500 text-xs mb-3 relative z-10">{t('exportDesc')}</p><button onClick={handleBackupToDrive} className="w-full py-3 bg-emerald-700 hover:bg-emerald-600 text-white rounded-xl font-bold text-sm shadow-lg transition flex items-center justify-center gap-2 relative z-10 border border-emerald-500"><i className="fab fa-google-drive"></i> {t('save')}</button></div><div className="bg-zinc-950 p-4 rounded-xl border border-zinc-800"><h3 className="text-zinc-300 font-bold mb-2 flex items-center gap-2"><i className="fa-solid fa-file-import text-indigo-500"></i> {t('restoreData')}</h3><p className="text-zinc-500 text-xs mb-3">{t('restoreDesc')}</p><div className="relative group"><button className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-indigo-400 border border-indigo-900/50 rounded-xl font-bold text-sm shadow-lg transition flex items-center justify-center gap-2 cursor-pointer" onClick={() => backupInputRef.current.click()}><i className="fa-solid fa-folder-open"></i> {t('selectFile')}</button><input type="file" ref={backupInputRef} className="hidden" accept=".json" onChange={handleImportFile} /></div></div></div><p className="text-center text-zinc-600 text-xs mt-6">{t('dataSafe')}</p></div></div>)}
                    
                    {isCropperOpen && (
                        <div className="fixed inset-0 z-[10000] bg-black flex flex-col items-center justify-center p-4 font-black">
                            <h3 className="text-white mb-8 tracking-[0.2em] uppercase text-xl text-center font-bold">Crop Image</h3>
                            <div className="max-w-full max-h-[60vh] bg-zinc-900 rounded-[2.5rem] overflow-hidden mb-10 shadow-2xl border border-zinc-800 shadow-black"><img ref={cropperImageRef} src={tempImage} style={{maxWidth: '100%'}} /></div>
                            <div className="flex gap-4 w-full max-w-sm">
                                <button onClick={handleCropConfirm} className="flex-[2] py-5 bg-emerald-600 rounded-3xl text-white shadow-xl text-lg uppercase tracking-widest active:scale-95 transition-transform font-black leading-none">Confirm</button>
                                <button onClick={() => {setIsCropperOpen(false); setTempImage(null);}} className="flex-1 py-5 bg-red-600 rounded-3xl text-white shadow-lg uppercase active:scale-95 transition-transform font-black leading-none">Cancel</button>
                            </div>
                        </div>
                    )}
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
