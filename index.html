                    // 🛡️ 安全过滤：移除 Base64 图片，防止请求体过大报错
                    const stripped = { 
                        ...data, 
                        // 如果 Logo 是 Base64，不上传
                        appLogo: (data.appLogo && data.appLogo.startsWith('data:') && data.appLogo.length > 1000) ? null : data.appLogo,

                            : [] 
                    };
                    
                    // 预检大小
                    const payload = JSON.stringify(stripped);
                    const size = new Blob([payload]).size;
                    
                    if (size > 100000) {
                         // 超过100KB，虽然 syncToCloud 是自动的，但为了不报错，我们可以选择不上传，或者只提示
                         // 这里简单处理：如果太大，就不传，并显示警告

                const newTrainees = safeTrainees.map(t => {
                    let history = Array.isArray(t.attendanceHistory) ? [...t.attendanceHistory] : [];
                    // Remove old record for this date (if any)
                    history = history.filter(h => {
                         const d = typeof h === 'string' ? h : (h?.date);
                         return d !== attendanceDate;
                    });
                    
                    let currentCount = t.attendedSessions !== undefined ? t.attendedSessions : history.length;
                    
                    // If checked, add new record
                    if (attendanceList.includes(t.id)) {
                        history.push({ date: attendanceDate, status: 'present' });
                    } 
                    
                    history.sort((a, b) => {

                    });

                    const rate = Math.round((actualCount / customTotal) * 100);

                        attendanceHistory: history, 
                        attendedSessions: actualCount

            const handleWhatsappShare = () => { const names = attendanceFiltered.filter(i => attTab === 'trainees' ? attendanceList.includes(i.id) : coachAttendanceList.includes(i.id)).map(i => i.name.toUpperCase()); window.open(`https://wa.me/?text=${encodeURIComponent(`📅 ${attendanceDate} Attendance:\n${names.join('\n')}`)}`, '_blank'); };
            const handleExportAttendanceExcel = () => {

                }
            };
            
            const handleImportFile = (e) => { const f=e.target.files?.[0]; if(!f) return; const r=new FileReader(); r.onload=(ev) => { try { const p=JSON.parse(ev.target.result); if(confirm("Overwrite?")) { updateData(p); setIsDataToolsOpen(false); } } catch (e) { alert("Error"); } }; r.readAsText(f); };
            
            // 🔥 新增：断开连接

                setCloudStatus("");

                if (!cloudConfig.key || !cloudConfig.binId) return alert("Key & Bin ID required");
                
                if(!confirm("⚠️ Overwrite CLOUD data with LOCAL data?")) return;
                
                // 保存配置
                localStorage.setItem('cfc_jsonbin_config', JSON.stringify(cloudConfig));
                setCloudStatus("⏳");
                
                try {
                    const currentData = { 
                        trainees: safeTrainees, 
                        coaches: safeCoaches, 
                        teams: safeTeams, 
                        leagueName: leagueName, 
                        appLogo: appLogo 
                    };
                    
                    // 🛡️ 强力瘦身：检查每一条数据，剔除 Base64 图片
                    const stripped = { 
                        ...currentData,
                        appLogo: (currentData.appLogo && currentData.appLogo.startsWith('data:') && currentData.appLogo.length > 1000) ? null : currentData.appLogo,
                        trainees: currentData.trainees.map(t => {
                            if (t.image && t.image.startsWith('data:') && t.image.length > 500) {
                                return { ...t, image: DEFAULT_IMAGE };
                            }
                            return t;
                        })
                    };
                    
                    // 检查大小
                    const payload = JSON.stringify(stripped);
                    const size = new Blob([payload]).size;
                    console.log("Payload size:", size);

                    if(size > 100000) {
                        if(!confirm(`⚠️ Data size (${Math.round(size/1024)}KB) exceeds 100KB free limit.\nProceed anyway?`)) {
                            setCloudStatus("");
                            return;
                        }
                    }

                    const res = await fetch(`${JSONBIN_URL}/${cloudConfig.binId}`, {
                        method: 'PUT', 
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': cloudConfig.key },
                        body: payload
                    });
                    
                    if (res.ok) {
                        setIsCloudConnected(true);
                        setCloudStatus("✅");
                        alert("✅ Push Successful! (Images optimized)");
                        setIsCloudModalOpen(false);
                        setTimeout(() => setCloudStatus("☁️"), 3000);
                    } else {
                        const errorText = await res.text();
                        throw new Error(`API Error (${res.status}): ${errorText}`);
                    }
                } catch (e) {
                    setCloudStatus("❌");
                    alert("Push Failed: " + e.message);
                }
            };

            // 🔥 新增：手动下载数据（覆盖本地）

                }

                                    {userRole === 'admin' && (
                                        <button onClick={() => setIsCloudModalOpen(true)} className={`px-2 py-0.5 rounded flex items-center gap-1 transition-all border text-[10px] font-bold ${isCloudConnected ? 'bg-indigo-900/40 text-indigo-400 border-indigo-500/30' : 'bg-zinc-800 text-zinc-500 border-zinc-700'}`}>

                                            <i className={`fa-solid ${cloudStatus === '🔄' ? 'fa-arrows-rotate fa-spin text-yellow-400' : (cloudStatus === '✅' ? 'fa-check text-emerald-400' : (cloudStatus === '❌' ? 'fa-triangle-exclamation text-red-500' : 'fa-cloud'))}`}></i> 
                                            {cloudStatus ? ' Syncing' : (isCloudConnected ? ' Cloud On' : ' Cloud Off')}

                                    )}
                                    <button onClick={() => setIsShareAppOpen(true)} className="hover:text-white transition-colors"><i className="fa-solid fa-qrcode text-sm"></i></button>
                                    <button onClick={() => setUserRole(null)} className="hover:text-red-400 transition-colors"><i className="fa-solid fa-right-from-bracket"></i></button>
                                </div>
                            </div>
                        </div>
                        {userRole === 'admin' && (
                            <div className="grid grid-cols-4 sm:flex gap-2 w-full">
                                {/* 🔥 Scrollable Toolbar Container */}
                                <div className="col-span-4 flex gap-2 overflow-x-auto no-scrollbar pb-1">
                                    <button onClick={() => setIsFinanceOpen(true)} className="flex-1 min-w-[80px] px-2 py-3 bg-yellow-600 rounded-xl font-bold text-[10px] shadow-lg uppercase active:scale-95 transition-all flex flex-col items-center justify-center gap-1 whitespace-nowrap"><i className="fa-solid fa-sack-dollar text-lg"></i>{t('financeTool')}</button>
                                    {/* 🔥 给考勤按钮加了异常保护 */}
                                    <button onClick={() => { try { openAttendanceModal(); } catch (e) { alert("Error opening attendance: " + e.message); } }} className="flex-1 min-w-[80px] px-2 py-3 bg-emerald-700 rounded-xl font-bold text-[10px] shadow-lg uppercase active:scale-95 transition-all flex flex-col items-center justify-center gap-1 whitespace-nowrap"><i className="fa-solid fa-calendar-check text-lg"></i>{t('attendanceTool')}</button>
                                    <button onClick={() => { setIsCoachOpen(true); setCoachView('list'); }} className="flex-1 min-w-[80px] px-2 py-3 bg-blue-800 rounded-xl font-bold text-[10px] shadow-lg uppercase active:scale-95 transition-all flex flex-col items-center justify-center gap-1 whitespace-nowrap"><i className="fa-solid fa-user-tie text-lg"></i>{t('coachTool')}</button>
                                    <button onClick={() => setIsSchoolManagerOpen(true)} className="flex-1 min-w-[80px] px-2 py-3 bg-zinc-800 rounded-xl font-bold text-[10px] border border-zinc-700 active:scale-95 shadow-lg uppercase flex flex-col items-center justify-center gap-1 whitespace-nowrap"><i className="fa-solid fa-school text-lg"></i>{t('manageSchools')}</button>
                                    <button onClick={() => setIsDataToolsOpen(true)} className="flex-1 min-w-[80px] px-2 py-3 bg-indigo-800 rounded-xl font-bold text-[10px] shadow-lg uppercase active:scale-95 transition-all flex flex-col items-center justify-center gap-1 whitespace-nowrap"><i className="fa-solid fa-cloud-arrow-up text-lg"></i>{t('backupTools')}</button>
                                    <button onClick={handleRegister} className="flex-1 min-w-[80px] px-2 py-3 bg-white text-black rounded-xl font-black text-[10px] active:scale-95 shadow-xl uppercase tracking-tighter shadow-white/5 flex flex-col items-center justify-center gap-1 whitespace-nowrap"><i className="fa-solid fa-user-plus text-lg"></i>{t('register')}</button>
                                </div>
                            </div>
                        )}
                    </header>

                    {/* Filter & Grid */}
                    <div className="mb-8 space-y-4">
                        <input className="w-full bg-zinc-900 border border-zinc-800 rounded-2xl py-4 px-6 outline-none focus:border-indigo-500 text-lg shadow-xl text-white placeholder-zinc-700 font-bold" placeholder={t('searchPlaceholder')} value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                        {/* 🔥 Restored School Buttons */}
                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                             {[t('common', 'all'), ...(safeTeams || [])].map(team => (
                                <button 
                                    key={team} 
                                    onClick={() => setSelectedTeam(team)} 
                                    className={`px-4 py-2 rounded-xl border font-bold whitespace-nowrap transition-all ${selectedTeam === team ? 'bg-yellow-500 text-black border-yellow-500 shadow-lg' : 'bg-zinc-900 text-zinc-500 border-zinc-800'}`}
                                >
                                    {team}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4">
                        {(filteredTrainees || []).map(trainee => { 
                            const vals = Object.values(trainee.stats || {});
                            const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
                            const grade = getStatGrade(avg);
                            const lastAtt = trainee.attendanceHistory?.length ? trainee.attendanceHistory.sort((a,b)=>(b.date||b).localeCompare(a.date||a)).reverse()[0] : null; 
                            const lastDate = lastAtt ? (typeof lastAtt === 'string' ? lastAtt : lastAtt.date) : 'N/A';
                            
                            return (
                                <div key={trainee.id} className="bg-zinc-900 rounded-3xl border border-zinc-800 overflow-hidden flex flex-col group hover:border-zinc-500 shadow-xl transition-all relative">
                                    <div className="h-32 relative overflow-hidden">
                                        <img src={getOptimizedImageUrl(trainee.image)} className="w-full h-full object-cover transition-transform group-hover:scale-110 duration-700" onError={e => e.target.src = DEFAULT_IMAGE}/>
                                        <div className="absolute inset-0 bg-gradient-to-t from-zinc-900 via-transparent opacity-80"></div>
                                        <span className="absolute top-3 left-3 bg-yellow-500 text-black text-[10px] font-black px-1.5 rounded shadow-lg">{getPositionCode(trainee.primaryPosition)}</span>
                                        
                                        {/* 🔥 这里的评级角标 */}
                                        <div className="absolute top-2 right-2 flex flex-col items-center">
                                            <span className={`text-xl italic leading-none ${getGradeColor(grade)}`}>{grade}</span>
                                        </div>

                                        <div className="absolute bottom-3 left-4 right-4 truncate leading-tight font-black uppercase text-white drop-shadow-md">
                                            {trainee.name}
                                            {/* 🔥 新增：卡片显示组别 */}
                                            {trainee.category && <span className="ml-2 text-[9px] bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-400 font-normal align-middle">{trainee.category}</span>}
                                        </div>
                                        {/* 🔥 Share Button on Card */}
                                        <button onClick={(e)=>{e.stopPropagation(); handleSystemShare(trainee);}} className="absolute bottom-2 right-2 w-7 h-7 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-emerald-600 transition-all border border-white/20 shadow-lg z-20 active:scale-90"><i className="fa-solid fa-share-nodes text-[10px]"></i></button>
                                    </div>
                                    <div className="p-3 flex-1 flex flex-col">
                                        <div className="grid grid-cols-3 gap-1 mb-2">
                                            {['pace', 'shooting', 'passing'].map(s => <div key={s} className="bg-black/30 p-1 rounded-xl flex flex-col items-center border border-zinc-800/50 shadow-inner font-black uppercase tracking-tighter"><span className="text-zinc-600 text-[8px]">{s.slice(0,3)}</span><span className={`text-xs ${getGradeColor(getStatGrade(trainee.stats?.[s]))}`}>{getStatGrade(trainee.stats?.[s])}</span></div>)}
                                        </div>
                                        {trainee.coachComment && <div className="mb-2 px-1"><p className="text-[9px] text-zinc-500 truncate italic"><i className="fa-solid fa-comment-dots mr-1"></i> {trainee.coachComment}</p></div>}
                                        
                                        {/* 🔥 新增：显示身高体重 */}
                                        <div className="flex justify-between items-center px-1 mb-2 text-[9px] text-zinc-500 font-mono">
                                            {trainee.height && <span>H: {trainee.height}cm</span>}
                                            {trainee.weight && <span>W: {trainee.weight}kg</span>}
                                        </div>

                                        <div className="mt-auto pt-3 border-t border-zinc-800/50 flex justify-between items-center">
                                            {/* 🔥 修复：确保出席率文字显示在卡片底部，动态显示总周期 */}
                                            <div className={`flex flex-col gap-0.5 group/att ${userRole === 'admin' ? 'cursor-pointer' : ''}`} onClick={(e) => toggleQuickAttendance(e, trainee)}>
                                                <div className="flex items-center gap-2">
                                                    <div className={`relative w-2.5 h-2.5 rounded-full ${getAttendanceColor(trainee.attendance || 0)} shadow-[0_0_8px_rgba(0,0,0,0.5)]`}>
                                                        {trainee.attendanceHistory?.some(h => (h.date||h) === new Date().toISOString().slice(0, 10)) && (
                                                            <span className="absolute inset-0 rounded-full bg-emerald-400 animate-ping opacity-75"></span>
                                                        )}
                                                    </div>
                                                    <span className="text-[10px] text-zinc-400 font-bold tracking-wider">{trainee.attendance || 0}% <span className="text-zinc-600 text-[8px]">({trainee.totalSessions || PRESET_YEARLY_TOTAL}W)</span></span>
                                                </div>
                                                <span className="text-[8px] text-zinc-600 font-mono pl-4.5 uppercase tracking-wider">{t('common', 'lastAtt')}: {lastDate}</span>
                                            </div>
                                            
                                            {userRole === 'admin' && (
                                                <div className="flex gap-1">
                                                    <button onClick={() => handleEdit(trainee)} className="w-7 h-7 rounded-full bg-zinc-800 text-zinc-400 flex items-center justify-center active:scale-90 transition-transform"><i className="fa-solid fa-pen text-xs"></i></button>
                                                    <button onClick={() => deleteTrainee(trainee.id)} className="w-7 h-7 rounded-full bg-red-900/20 text-red-500 flex items-center justify-center active:scale-90 transition-transform shadow-lg shadow-red-900/10"><i className="fa-solid fa-trash-can text-xs"></i></button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* --- Monthly Report Modal (Interactive!) --- */}
                    {isMonthlyReportOpen && (
                        <div className="fixed inset-0 z-[10005] bg-black/90 backdrop-blur-md flex items-center justify-center p-4 fade-in" onClick={() => setIsMonthlyReportOpen(false)}>

                                        {/* 🔥 报表内补录日期 */}
                                        <div className="flex bg-black/50 rounded-xl border border-zinc-700 p-1">
                                            <input type="date" className="bg-transparent text-white text-xs px-2 outline-none w-28" value={reportDateInput} onChange={e => setReportDateInput(e.target.value)} />
                                            <button onClick={addReportDate} className="bg-zinc-800 hover:bg-emerald-600 text-white px-3 py-1 rounded-lg text-xs font-bold transition-all"><i className="fa-solid fa-plus"></i></button>
                                        </div>
                                        <div className="w-px h-6 bg-zinc-700 mx-2"></div>
                                        <input type="month" className="bg-zinc-950 text-white px-3 py-2 rounded-xl border border-zinc-700 text-sm font-bold outline-none focus:border-blue-500" value={reportMonth} onChange={e => setReportMonth(e.target.value)} />
                                        <button onClick={() => setIsMonthlyReportOpen(false)} className="text-zinc-500 hover:text-white"><i className="fa-solid fa-xmark text-2xl"></i></button>
                                    </div>
                                </div>
                                <div className="flex gap-2 overflow-x-auto no-scrollbar mb-4 pb-2">
                                    <button onClick={() => setReportSchool('全部')} className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all whitespace-nowrap ${reportSchool === '全部' ? 'bg-blue-600 border-blue-500 text-white' : 'bg-zinc-800 border-zinc-700 text-zinc-400'}`}>{t('common', 'all')}</button>
                                    {(safeTeams || []).map(team => (
                                        <button key={team} onClick={() => setReportSchool(team)} className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all whitespace-nowrap ${reportSchool === team ? 'bg-blue-600 border-blue-500 text-white' : 'bg-zinc-800 border-zinc-700 text-zinc-400'}`}>{team}</button>
                                    ))}
                                </div>

                                <div className="flex-1 overflow-auto border border-zinc-800 rounded-2xl bg-black/20">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-zinc-900 sticky top-0 z-10 shadow-lg">
                                            <tr>
                                                <th className="p-4 text-xs font-black text-zinc-500 uppercase tracking-wider border-b border-zinc-800 sticky left-0 bg-zinc-900 z-20 w-32">Name</th>
                                                {(reportData.dates || []).map(d => (
                                                    // 🔥 可点击修改日期的表头
                                                    <th key={d} onClick={() => renameReportDate(d)} className="p-2 text-[10px] font-mono text-zinc-400 border-b border-zinc-800 text-center min-w-[40px] cursor-pointer hover:text-white hover:bg-white/5 transition-colors" title="Rename Date">
                                                        {d.slice(8)}
                                                    </th>
                                                ))}
                                                <th className="p-4 text-xs font-black text-zinc-500 uppercase tracking-wider border-b border-zinc-800 text-center sticky right-0 bg-zinc-900 z-20 w-16">Total</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-zinc-800">
                                            {(reportData.list || []).map(p => {
                                                const history = p.attendanceHistory || [];
                                                const presentDates = new Set(history.map(h => (typeof h === 'string' ? h : h.date)));
                                                let count = 0;
                                                return (
                                                    <tr key={p.id} className="hover:bg-white/5 transition-colors group/row">
                                                        <td className="p-4 text-xs font-bold text-white border-r border-zinc-800 sticky left-0 bg-zinc-900/95 z-10 group-hover/row:bg-zinc-800 transition-colors">
                                                            <div className="truncate w-24">{p.name}</div>
                                                            <div className="text-[8px] text-zinc-500 font-normal mt-0.5 truncate w-24">{p.team}</div>
                                                        </td>
                                                        {(reportData.dates || []).map(d => {
                                                            const isPresent = presentDates.has(d);
                                                            if (isPresent) count++;
                                                            return (
                                                                // 🔥 可点击切换状态的格子
                                                                <td key={d} onClick={() => toggleReportAttendance(p.id, d)} className="p-2 text-center border-r border-zinc-800/50 cursor-pointer hover:bg-white/10 transition-colors">
                                                                    {isPresent ? <i className="fa-solid fa-check text-emerald-500 text-xs"></i> : <span className="text-zinc-800 text-[10px] group-hover/row:text-zinc-600">-</span>}
                                                                </td>
                                                            );
                                                        })}
                                                        <td className="p-4 text-sm font-black text-blue-400 text-center sticky right-0 bg-zinc-900/95 z-10 border-l border-zinc-800 group-hover/row:bg-zinc-800">
                                                            {count}
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                            {(reportData.list || []).length === 0 && (
                                                <tr><td colSpan={(reportData.dates?.length || 0) + 2} className="p-8 text-center text-zinc-500 italic text-sm">{t('noData')}</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="mt-4 flex justify-end">
                                    <button onClick={handleDownloadReport} className="px-8 py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-xl border border-zinc-700 flex items-center gap-2 text-xs uppercase tracking-widest active:scale-95 transition-all">
                                        <i className="fa-solid fa-download"></i> Export CSV
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isCoachOpen && (
                        <div className="fixed inset-0 z-[600] bg-black/90 backdrop-blur-md flex items-center justify-center p-4 fade-in" onClick={() => setIsCoachOpen(false)}>
                            <div className="bg-zinc-900 border border-zinc-800 w-full max-w-lg h-[85vh] rounded-[2.5rem] p-6 flex flex-col shadow-2xl shadow-black" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-6 shrink-0 font-black"><h2 className="text-xl flex items-center gap-2 text-white uppercase font-bold"><i className="fa-solid fa-user-tie text-blue-500"></i> {t('coachTool')}</h2><button onClick={() => setIsCoachOpen(false)} className="text-zinc-500 hover:text-white transition-colors"><i className="fa-solid fa-xmark text-2xl text-zinc-500"></i></button></div>
                                <div className="flex bg-zinc-950 p-1 rounded-2xl mb-6 border border-zinc-800 shrink-0 shadow-inner">
                                    {['list', 'attendance', 'finance'].map(v => <button key={v} onClick={() => setCoachView(v)} className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all ${coachView === v ? 'bg-blue-600 text-white shadow-lg' : 'text-zinc-500'}`}>{t('coach', v)}</button>)}
                                </div>
                                <div className="flex-1 overflow-y-auto pr-1 no-scrollbar space-y-4">
                                    {coachView === 'finance' && (
                                        <>
                                            <div className="bg-zinc-950 p-4 rounded-3xl border border-zinc-800 flex justify-between items-center mb-2 sticky top-0 z-10 backdrop-blur-lg shadow-lg">
                                                <input type="month" className="bg-zinc-900 text-white px-3 py-1.5 rounded-xl border border-zinc-700 text-sm outline-none focus:border-blue-500" value={financeMonth} onChange={e => setFinanceMonth(e.target.value)}/>
                                                <div className="text-right leading-none font-black uppercase tracking-tighter"><p className="text-[10px] text-zinc-500 mb-1">{t('coachTotalPayout')}</p><p className="text-2xl text-emerald-400 font-black">RM {payrollData.total}</p></div>
                                            </div>
                                            {payrollData.list.map(c => (
                                                <div key={c.id} className="bg-zinc-800 p-5 rounded-3xl border border-zinc-700 flex flex-col gap-4 shadow-lg shadow-black/20">
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex-1 leading-tight uppercase font-black">
                                                            <div className="flex items-center gap-2 font-bold text-white text-lg leading-none">{c.name}<button onClick={() => setExpandedCoachId(expandedCoachId === c.id ? null : c.id)} className="text-[10px] font-black text-zinc-400 bg-zinc-900 px-3 py-1 rounded-full border border-zinc-700 active:scale-95 transition-transform">{t('coachDetails')}</button></div>
                                                            <p className="text-xs text-zinc-500 mt-2 font-bold leading-none">{t('coach', 'sessions')}: {c.sessions} x RM{c.rate}</p>
                                                        </div>
                                                        <div className="text-right font-black uppercase tracking-widest leading-none">
                                                            <p className="text-xl text-white leading-none mb-2">RM {c.amount}</p>
                                                            <div className="flex items-center justify-end gap-2">
                                                                <button onClick={() => shareCoachPayslip(c)} className="w-8 h-6 rounded-lg bg-[#25D366]/20 text-[#25D366] flex items-center justify-center active:scale-90 transition-transform border border-[#25D366]/30 hover:bg-[#25D366] hover:text-white shadow-lg" title="Send Payslip"><i className="fa-brands fa-whatsapp text-xs"></i></button>
                                                                <button onClick={() => toggleCoachPayment(c.id)} className={`text-[10px] px-3 py-1 rounded-full transition-all font-black shadow-lg ${c.isPaid?'bg-emerald-600 text-white shadow-emerald-900/20':'bg-zinc-900 border border-zinc-700 text-zinc-500 shadow-none'}`}>{c.isPaid ? t('common', 'paid') : t('common', 'unpaid')}</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    
                                                    {expandedCoachId === c.id && (
                                                        <div className="bg-black/40 p-4 rounded-2xl space-y-3 border border-zinc-700/30 fade-in max-h-64 overflow-y-auto no-scrollbar shadow-inner">
                                                            {(c.details || []).map((d, i) => (
                                                                <div key={i} className="flex justify-between items-center text-[12px] border-b border-zinc-800/50 pb-3 last:border-0 last:pb-0 font-bold uppercase tracking-tighter">
                                                                    <div className="flex flex-col tracking-tighter leading-tight">
                                                                        <span className="text-zinc-200">{d.date}</span>
                                                                        <span className="text-blue-400 text-[10px] uppercase font-black">{d.school || t('common', 'unknown')}</span>
                                                                    </div>
                                                                    <button onClick={() => removeCoachRecord(c.id, d.date, d.school)} className="w-8 h-8 rounded-xl bg-red-900/20 text-red-500 flex items-center justify-center hover:bg-red-900/50 active:scale-90 transition-all shadow-lg shadow-black/30 border border-red-900/30"><i className="fa-solid fa-trash-can text-[11px]"></i></button>
                                                                </div>
                                                            ))}
                                                            {(!c.details || c.details.length === 0) && <p className="text-center text-zinc-600 text-[10px] italic py-4 font-black">{t('noData')}</p>}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                            <button onClick={exportCoachPayrollExcel} className="w-full mt-4 py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-xl border border-zinc-600 flex items-center justify-center gap-2"><i className="fa-solid fa-file-invoice-dollar"></i> {t('coachExport')}</button>
                                        </>
                                    )}
                                    {coachView === 'list' && (
                                        <div className="space-y-4 font-black uppercase tracking-tighter">
                                            <div className="bg-zinc-950 p-5 rounded-[2.5rem] border border-zinc-800 mb-2 shadow-xl shadow-black/20">
                                                <div className="grid grid-cols-2 gap-3 mb-3 leading-none">
                                                    <input className="bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500 outline-none" placeholder={t('common', 'name')} value={coachForm.name} onChange={e => setCoachForm({...coachForm, name: e.target.value})} />
                                                    <input className="bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm text-white font-mono focus:border-blue-500 outline-none" placeholder={t('common', 'phone')} value={coachForm.phone} onChange={e => setCoachForm({...coachForm, phone: e.target.value})} />
                                                </div>
                                                <div className="grid grid-cols-3 gap-2 mb-4 leading-none">
                                                    <select className="bg-zinc-900 border border-zinc-700 rounded-xl px-2 py-3 text-[10px] text-white focus:border-blue-500 outline-none uppercase font-bold" value={coachForm.role} onChange={e => setCoachForm({...coachForm, role: e.target.value})}>
                                                        {COACH_ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                                                    </select>
                                                    <select className="bg-zinc-900 border border-zinc-700 rounded-xl px-2 py-3 text-[10px] text-white focus:border-blue-500 outline-none uppercase font-bold" value={coachForm.rank} onChange={e => setCoachForm({...coachForm, rank: e.target.value})}>
                                                        {COACH_RANKS.map(r => <option key={r} value={r}>{r}</option>)}
                                                    </select>
                                                    <div className="relative">
                                                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-[10px]">RM</span>

                                    <input className="w-full bg-black/50 border border-zinc-700 rounded-lg text-xs px-2 py-1.5 text-white focus:border-emerald-500 outline-none" placeholder={t('attSearch')} value={attendanceSearchTerm} onChange={e => setAttendanceSearchTerm(e.target.value)} />

                                        <div key={item.id} onClick={() => toggleAttendance(item.id)} className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition-all ${(attTab === 'trainees' ? attendanceList.includes(item.id) : coachAttendanceList.includes(item.id)) ? 'bg-emerald-900/20 border-emerald-500/50' : 'bg-zinc-800/50 border-zinc-700 opacity-60'}`}>
                                            <div className="flex items-center gap-3">
                                                <div className={`w-5 h-5 rounded flex items-center justify-center border ${(attTab === 'trainees' ? attendanceList.includes(item.id) : coachAttendanceList.includes(item.id)) ? 'bg-emerald-500 border-emerald-500' : 'border-zinc-500'}`}>{(attTab === 'trainees' ? attendanceList.includes(item.id) : coachAttendanceList.includes(item.id)) && <i className="fa-solid fa-check text-black text-xs"></i>}</div>
                                                <div className="leading-none"><p className="text-sm font-bold text-white uppercase">{item.name}</p><p className="text-[10px] text-zinc-500 uppercase mt-1">{item.team || item.role}</p></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={submitAttendance} className="flex-[2] py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg">{t('attConfirm')}</button>
                                    {/* 🔥 修复：加回 WhatsApp 分享按钮 */}
                                    <button onClick={handleWhatsappShare} className="flex-1 py-3 bg-[#25D366] hover:bg-[#1da851] text-white font-bold rounded-xl shadow-lg flex items-center justify-center" title={t('attWhatsapp')}><i className="fa-brands fa-whatsapp text-xl"></i></button>
                                    <button onClick={handleExportAttendanceExcel} className="flex-1 py-3 bg-zinc-800 text-white font-bold rounded-xl border border-zinc-700 uppercase text-[10px]" title={t('attExcel')}><i className="fa-solid fa-file-csv mr-1"></i> Day</button>
                                    <button onClick={handleExportFullHistory} className="flex-1 py-3 bg-blue-900/40 text-blue-400 font-bold rounded-xl border border-blue-900/50 uppercase text-[10px]" title={t('attHistoryFull')}><i className="fa-solid fa-history mr-1"></i> Full</button>
                                    {/* 🔥 点击打开月报弹窗 */}
                                    <button onClick={() => { setIsMonthlyReportOpen(true); setReportSchool(selectedTeam); }} className="flex-1 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg flex items-center justify-center gap-2 uppercase text-[10px]" title={t('attMonthly')}><i className="fa-solid fa-table"></i> Month</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* ... other modals ... */}
                    
                    {/* --- Finance Modal (Z-Index 9999) --- */}
                    {isFinanceOpen && (<div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm fade-in" onClick={() => setIsFinanceOpen(false)}><div className="bg-zinc-900 w-full max-w-lg rounded-2xl border border-yellow-600 shadow-2xl p-6 max-h-[90vh] overflow-y-auto flex flex-col" onClick={e => e.stopPropagation()}><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-white flex items-center gap-2 uppercase"><i className="fa-solid fa-sack-dollar text-yellow-500"></i> {t('finTitle')}</h2><button onClick={() => setIsFinanceOpen(false)}><i className="fa-solid fa-xmark text-xl text-zinc-500 hover:text-white"></i></button></div><div className="bg-yellow-900/20 border border-yellow-800 p-3 rounded-xl mb-4 flex justify-between items-center relative group"><div className="text-xs text-yellow-200"><p className="font-bold">{BANK_INFO.bankName}</p><p className="font-mono text-yellow-400 text-sm my-0.5">{BANK_INFO.accNum}</p><p className="text-[10px] opacity-70">{BANK_INFO.holder}</p></div><button onClick={copyBankInfo} className="bg-yellow-700/50 hover:bg-yellow-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1"><i className="fa-regular fa-copy"></i> {t('finCopy')}</button></div><div className="grid grid-cols-2 gap-3 mb-4"><div className="bg-emerald-900/30 border border-emerald-800 p-3 rounded-xl flex flex-col items-center"><span className="text-[10px] text-emerald-400 uppercase">{t('finTotal')}</span><span className="text-xl font-bold text-white">RM {financeSummary.total}</span><span className="text-[10px] text-zinc-400">({financeSummary.paidCount} pax)</span></div><div className="bg-red-900/30 border border-red-800 p-3 rounded-xl flex flex-col items-center"><span className="text-[10px] text-red-400 uppercase">{t('finPending')}</span><span className="text-xl font-bold text-white">RM {financeSummary.pending}</span><span className="text-[10px] text-zinc-400">({filteredTrainees.length - financeSummary.paidCount} pax)</span></div></div>
                    <div className="mb-2 px-1">
                        <input className="w-full bg-black/50 border border-zinc-700 rounded-lg text-xs px-2 py-1.5 text-white focus:border-yellow-500 outline-none" placeholder={t('finSearch')} value={financeSearchTerm} onChange={e => setFinanceSearchTerm(e.target.value)} />
                    </div>
                    <div className="flex justify-between items-center mb-2 px-1">
                        <span className="text-xs text-zinc-500">Selected: {financeFiltered.length}</span>
                        <button onClick={toggleAllFeeStatus} className="text-xs text-indigo-400 hover:text-indigo-300 font-bold border border-indigo-500/30 px-2 py-1 rounded">
                            {t('finToggleAll')}
                        </button>
                    </div>
                    <div className="flex gap-2 mb-4"><div className="flex-1 flex justify-between items-center bg-zinc-950 p-2 rounded-lg border border-zinc-800"><span className="text-xs text-zinc-400 pl-2">{t('finFee')}</span><input type="number" className="w-20 bg-black text-white text-right text-sm px-2 py-1 rounded border border-zinc-700 focus:border-yellow-500 outline-none" value={monthlyFee} onChange={e => setMonthlyFee(parseInt(e.target.value) || 0)} /></div><select className="w-1/3 bg-zinc-950 border border-zinc-800 rounded-lg text-white text-xs px-2 outline-none" value={msgTemplate} onChange={(e) => setMsgTemplate(e.target.value)}><option value="gentle">🌸 {t('msgTemplates', 'gentle')}</option><option value="friendly">🤝 {t('msgTemplates', 'friendly')}</option><option value="soft">🍃 {t('msgTemplates', 'soft')}</option><option value="formal">👔 {t('msgTemplates', 'formal')}</option></select></div><div className="flex-1 overflow-y-auto space-y-2 mb-4 pr-1">{financeFiltered?.map(trainee => { const isPaid = trainee.feeHistory && trainee.feeHistory[financeMonth]; return (<div key={trainee.id} className="flex items-center justify-between p-3 rounded-xl border border-zinc-700 bg-zinc-800/30"><div className="flex items-center gap-3"><div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${isPaid ? 'bg-emerald-600 text-white' : 'bg-red-900/50 text-red-500 border border-red-800'}`}>{isPaid ? <i className="fa-solid fa-check"></i> : "RM"}</div><div><p className="text-sm font-bold text-white uppercase">{trainee.name}</p><p className="text-[10px] text-zinc-500 uppercase">{trainee.team}</p></div></div><button onClick={() => toggleFeeStatus(trainee.id)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${isPaid ? 'bg-emerald-600 border-emerald-500 text-white' : 'bg-transparent border-zinc-600 text-zinc-400 hover:border-yellow-500 hover:text-yellow-500'}`}>{isPaid ? t('common', 'paid') : t('common', 'unpaid')}</button></div>); })}</div><button onClick={exportFinanceExcel} className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded-xl border border-zinc-600 flex items-center justify-center gap-2"><i className="fa-solid fa-file-invoice-dollar"></i> {t('finExport')}</button></div></div>)}
                    
                    {/* ... Cloud Modal ... */}
                    {isCloudModalOpen && (
                        <div className="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm fade-in">
                            <div className="bg-zinc-900 w-full max-w-sm rounded-2xl border border-emerald-700 shadow-2xl p-6">
                                {/* ... cloud modal content ... */}
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-white flex items-center gap-2"><i className="fa-solid fa-cloud text-emerald-500"></i> {t('cloud', 'setup')}</h2>
                                    <button onClick={() => setIsCloudModalOpen(false)}><i className="fa-solid fa-xmark text-zinc-500 hover:text-white"></i></button>
                                </div>
                                <div className="space-y-4">
                                    <p className="text-sm text-zinc-400 leading-relaxed">{t('cloudDesc')}</p>
                                    <div className="bg-black p-3 rounded-lg border border-zinc-700">
                                        <label className="text-xs text-zinc-500 block mb-1 font-bold">{t('cloud', 'key')}</label>
                                        <input className="w-full bg-transparent text-white outline-none font-mono text-sm" placeholder="X-Master-Key" value={cloudConfig.key} onChange={e => setCloudConfig({...cloudConfig, key: e.target.value})} />
                                    </div>
                                    <div className="bg-black p-3 rounded-lg border border-zinc-700">
                                        <label className="text-xs text-zinc-500 block mb-1 font-bold">{t('cloud', 'bin')}</label>
                                        <input className="w-full bg-transparent text-white outline-none font-mono text-sm" placeholder="Bin ID" value={cloudConfig.binId} onChange={e => setCloudConfig({...cloudConfig, binId: e.target.value})} />
                                    </div>
                                    
                                    <div className="flex gap-2 pt-2">
                                        <button onClick={handleManualPull} className="flex-1 py-3 bg-emerald-700 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs uppercase flex flex-col items-center gap-1"><i className="fa-solid fa-download"></i> Save & Pull</button>
                                        <button onClick={handleManualPush} className="flex-1 py-3 bg-blue-700 hover:bg-blue-600 text-white font-bold rounded-xl text-xs uppercase flex flex-col items-center gap-1"><i className="fa-solid fa-upload"></i> Save & Push</button>
                                    </div>

                                    <div className="flex gap-2">
                                         <button onClick={createCloudBin} className="flex-1 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 text-xs font-bold rounded-lg border border-zinc-700">{t('cloudCreate')}</button>
                                         <button onClick={handleDisconnect} className="flex-1 py-2 bg-red-900/30 hover:bg-red-900/50 text-red-500 text-xs font-bold rounded-lg border border-red-900/50">Disconnect</button>
                                    </div>

                                    <div className="pt-4 mt-2 border-t border-zinc-800">
                                        <label className="text-sm text-blue-400 font-bold mb-2 block flex items-center gap-2"><i className="fa-solid fa-image"></i> {t('imgCloudSetup')}</label>
                                        <div className="bg-black p-3 rounded-lg border border-zinc-700 mb-2"><label className="text-xs text-zinc-500 block mb-1 font-bold">{t('imgCloudName')}</label><input className="w-full bg-transparent text-white outline-none font-mono text-sm" placeholder="e.g. dxyz..." value={imgConfig.cloudName} onChange={e => setImgConfig({...imgConfig, cloudName: e.target.value})} /></div>
                                        <div className="bg-black p-3 rounded-lg border border-zinc-700 mb-2"><label className="text-xs text-zinc-500 block mb-1 font-bold">{t('imgUploadPreset')}</label><input className="w-full bg-transparent text-white outline-none font-mono text-sm" placeholder="e.g. cfc_preset" value={imgConfig.uploadPreset} onChange={e => setImgConfig({...imgConfig, uploadPreset: e.target.value})} /></div>
                                        <div className="flex gap-2">
                                             <button onClick={testCloudinary} className="flex-1 py-2 bg-zinc-700 hover:bg-zinc-600 text-white text-xs font-bold rounded-lg border border-zinc-600">{t('imgTest')}</button>
                                             <button onClick={saveImgConfig} className="flex-1 py-2 bg-blue-900/50 hover:bg-blue-800 text-blue-400 text-xs font-bold rounded-lg border border-blue-900/30">{t('imgSave')}</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {isDataToolsOpen && (<div className="fixed inset-0 z-[9000] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm fade-in" onClick={() => setIsDataToolsOpen(false)}><div className="bg-zinc-900 w-full max-w-md rounded-2xl border border-zinc-800 shadow-2xl p-6" onClick={e => e.stopPropagation()}><div className="flex justify-between items-center mb-4"><h2 className="text-lg font-bold text-white uppercase flex items-center gap-2"><i className="fa-solid fa-cloud-arrow-up text-indigo-500"></i> {t('backupTools')}</h2><button onClick={() => setIsDataToolsOpen(false)}><i className="fa-solid fa-xmark text-zinc-500 hover:text-white"></i></button></div><div className="space-y-4"><button onClick={handleBackupToDrive} className="w-full py-3 bg-emerald-700 hover:bg-emerald-600 text-white rounded-xl font-bold text-sm shadow-lg flex items-center justify-center gap-2 border border-emerald-500"><i className="fa-solid fa-download"></i> {t('backupToDrive')}</button><div className="bg-zinc-950 p-4 rounded-xl border border-zinc-800"><h3 className="text-zinc-300 font-bold mb-2 flex items-center gap-2 uppercase text-xs"><i className="fa-solid fa-file-import text-indigo-500"></i> {t('restoreData')}</h3><button className="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-indigo-400 border border-indigo-900/50 rounded-xl font-bold text-sm shadow-lg transition flex items-center justify-center gap-2" onClick={() => backupInputRef.current.click()}><i className="fa-solid fa-folder-open"></i> {t('selectFile')}</button><input type="file" ref={backupInputRef} className="hidden" accept=".json" onChange={handleImportFile} /></div></div></div></div>)}

                    {isCropperOpen && (<div className="fixed inset-0 z-[10000] bg-black flex flex-col items-center justify-center p-4 font-black"><h3 className="text-white mb-8 tracking-[0.2em] uppercase text-xl text-center font-bold">Crop Image</h3><div className="max-w-full max-h-[60vh] bg-zinc-900 rounded-[2.5rem] overflow-hidden mb-10 shadow-2xl border border-zinc-800 shadow-black"><img ref={cropperImageRef} src={tempImage} style={{maxWidth: '100%'}} /></div><div className="flex gap-4 w-full max-w-sm"><button onClick={handleCropConfirm} className="flex-[2] py-5 bg-emerald-600 rounded-3xl text-white shadow-xl text-lg uppercase tracking-widest active:scale-95 transition-transform font-black leading-none">Confirm</button><button onClick={() => {setIsCropperOpen(false); setTempImage(null);}} className="flex-1 py-5 bg-red-600 rounded-3xl text-white shadow-lg uppercase active:scale-95 transition-transform font-black leading-none">Cancel</button></div></div>)}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
